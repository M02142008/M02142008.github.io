<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔记 | 紫薯公主 CTF作战室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0e1a;color:#e9edff;padding:24px 18px 60px;line-height:1.75;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:820px;margin:0 auto}
a{color:#73c2ff;text-decoration:none}
a:hover{text-decoration:underline}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:14px;color:#8b93b0}
h1,h2,h3,h4{line-height:1.35;margin:26px 0 12px;color:#c49dff}
h1{font-size:30px;color:#e9edff;border-bottom:1px solid #232a45;padding-bottom:10px}
h2{font-size:23px;border-bottom:1px solid #1e2440;padding-bottom:6px}
h3{font-size:19px}
h4{font-size:17px}
p{margin:12px 0}
ul,ol{margin:12px 0 12px 26px}
li{margin:6px 0}
blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid #73c2ff;background:#141a2e;border-radius:0 8px 8px 0;color:#c7cee6}
blockquote p{margin:6px 0}
code{background:#171c32;color:#89cff0;padding:2px 6px;border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:.92em}
pre{background:#0f1424;border:1px solid #1e2440;border-radius:10px;padding:14px 16px;overflow:auto;margin:14px 0}
pre code{background:none;padding:0;color:#cdd6f4;font-size:13.5px;line-height:1.6}
hr{border:none;border-top:1px solid #232a45;margin:26px 0}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:15px;display:block;overflow:auto}
th,td{border:1px solid #2a3150;padding:8px 12px;text-align:left}
th{background:#171c32;color:#c49dff}
tr:nth-child(even) td{background:#12172a}
img{max-width:100%;border-radius:8px}
.err{background:#2a1420;border:1px solid #5a2233;padding:16px;border-radius:10px;color:#ff9db1}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="index.html">← 返回首页</a><span id="path"></span></div>
<div id="out">正在加载…</div>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var file = params.get('f') || '';
  var out = document.getElementById('out');
  document.getElementById('path').textContent = file;

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function inline(t){
    t = esc(t);
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">');
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/&lt;(https?:\/\/[^&]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    return t;
  }

  function isTableSep(l){ return /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l) && l.indexOf('-') > -1; }
  function splitRow(l){ return l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){ return c.trim(); }); }

  function render(md){
    var lines = md.split(/\r?\n/), html = [], i = 0, n = lines.length;
    var inList = null;

    function closeList(){ if(inList){ html.push('</'+inList+'>'); inList = null; } }

    while(i < n){
      var line = lines[i];

      var fence = line.match(/^\s*(```+|~~~+)\s*([\w+#-]*)\s*$/);
      if(fence){
        closeList();
        var mark = fence[1].charAt(0), buf = [];
        i++;
        while(i < n && !new RegExp('^\\s*' + mark + '{3,}\\s*$').test(lines[i])){ buf.push(lines[i]); i++; }
        i++;
        html.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }

      if(/^\s*$/.test(line)){ closeList(); i++; continue; }

      if(/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)){ closeList(); html.push('<hr>'); i++; continue; }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if(h){
        closeList();
        var lv = Math.min(h[1].length, 4);
        html.push('<h' + lv + '>' + inline(h[2].trim()) + '</h' + lv + '>');
        i++; continue;
      }

      if(/^\s*>/.test(line)){
        closeList();
        var qbuf = [];
        while(i < n && /^\s*>/.test(lines[i])){
          qbuf.push(lines[i].replace(/^\s*>\s?/, ''));
          i++;
        }
        html.push('<blockquote>' + render(qbuf.join('\n')) + '</blockquote>');
        continue;
      }

      if(line.indexOf('|') > -1 && i + 1 < n && isTableSep(lines[i + 1])){
        closeList();
        var head = splitRow(line);
        i += 2;
        var body = [];
        while(i < n && lines[i].indexOf('|') > -1 && !/^\s*$/.test(lines[i])){
          body.push(splitRow(lines[i])); i++;
        }
        var t = '<table><thead><tr>';
        head.forEach(function(c){ t += '<th>' + inline(c) + '</th>'; });
        t += '</tr></thead><tbody>';
        body.forEach(function(r){
          t += '<tr>';
          for(var k = 0; k < head.length; k++){ t += '<td>' + inline(r[k] === undefined ? '' : r[k]) + '</td>'; }
          t += '</tr>';
        });
        t += '</tbody></table>';
        html.push(t);
        continue;
      }

      var ul = line.match(/^\s*[-*+]\s+(.*)$/);
      var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if(ul || ol){
        var want = ul ? 'ul' : 'ol';
        if(inList !== want){ closeList(); html.push('<' + want + '>'); inList = want; }
        html.push('<li>' + inline((ul || ol)[1]) + '</li>');
        i++; continue;
      }

      closeList();
      var para = [line];
      i++;
      while(i < n && !/^\s*$/.test(lines[i]) && !/^\s*(#{1,6}\s|```|~~~|>|\s*[-*+]\s|\s*\d+[.)]\s)/.test(lines[i]) && !(lines[i].indexOf('|') > -1 && i + 1 < n && isTableSep(lines[i + 1]))){
        para.push(lines[i]); i++;
      }
      html.push('<p>' + para.map(inline).join('<br>') + '</p>');
    }
    closeList();
    return html.join('\n');
  }

  if(!file){ out.innerHTML = '<div class="err">没有指定笔记文件。</div>'; return; }

  fetch(file).then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.text();
  }).then(function(md){
    var arr = md.replace(/^\uFEFF/, '').split(/\r?\n/);
    while(arr.length && /^\s*$/.test(arr[0])) arr.shift();
    if(arr.length && /^---\s*$/.test(arr[0])){
      var k2 = 1;
      while(k2 < arr.length && !/^---\s*$/.test(arr[k2])) k2++;
      arr = arr.slice(k2 + 1);
    }
    md = arr.join('\n');
    out.innerHTML = render(md);
    var h1 = out.querySelector('h1');
    if(h1) document.title = h1.textContent + ' | 紫薯公主 CTF作战室';
  }).catch(function(e){
    out.innerHTML = '<div class="err">打不开这篇笔记（' + esc(String(e.message)) + '）。</div>';
  });
})();
</script>
</body>
</html>
